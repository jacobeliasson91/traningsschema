<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotbollsklubb - Schema</title>
<style>
:root{--bg-color:#f4f6f9;--table-border:#cbd5e1;--header-bg:#1e293b;--header-text:#fff;--pitch-bg:#334155;--pitch-text:#fff;--box-bg:#fff;--drag-over:#abebc6;--blue-bg:#dbeafe;--blue-border:#3b82f6;--blue-text:#1e40af;--yellow-bg:#fef9c3;--yellow-border:#eab308;--yellow-text:#854d0e}
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg-color);padding:20px;margin:0}
h1{color:#0f172a;font-size:22px;margin-bottom:5px}
p.info{color:#475569;font-size:14px;margin-bottom:15px;line-height:1.5}
.toolbar{margin-bottom:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:#2563eb;color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:background .2s}
.btn:hover{background:#1d4ed8}
.table-container{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1050px}
th,td{border-top:1px solid var(--table-border);border-bottom:1px solid var(--table-border);border-right:1px solid var(--table-border);text-align:left;font-size:13px}
th:first-child,td:first-child{border-left:1px solid var(--table-border)}
.day-group-end{border-right:24px solid var(--bg-color)!important}
th.day-header{background:var(--header-bg);color:var(--header-text);padding:12px 10px;font-size:14px;width:18%}
tr.pitch-header td{background:var(--pitch-bg);color:var(--pitch-text);padding:8px 14px;font-size:15px;border-top:16px solid var(--bg-color)!important}
.pitch-header-content{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.5px}
.btn-pitch-slot{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer;transition:all .2s;font-weight:600}
.btn-pitch-slot:hover{background:rgba(255,255,255,.25);border-color:#fff}
td.time-col{background:#e2e8f0;font-weight:bold;width:130px;color:#334155;padding:3px 6px}
.slot{height:48px;padding:4px;vertical-align:middle;background:transparent}
.team-slot-wrapper{position:relative;display:flex;gap:4px;width:100%;height:100%;min-height:40px;align-items:center}
.team-box{flex:1;height:100%;min-height:38px;background:var(--box-bg);border:1px dashed #cbd5e1;border-radius:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:0 10px;font-weight:bold;color:#1e293b;cursor:pointer;user-select:none;font-size:12px;line-height:1.2;transition:transform .1s,box-shadow .15s,background-color .2s}
.team-box.has-content{border-style:solid;cursor:grab}
.team-box.has-content:active{cursor:grabbing}
.team-box *{pointer-events:none}
.team-time{font-size:11px;font-weight:600;color:inherit;opacity:1;margin-top:2px;white-space:nowrap}
.team-box.drag-over{background:var(--drag-over)!important;border:2px dashed #27ae60!important}
.add-third-zone{position:absolute;right:0;top:0;width:12px;height:100%;background:transparent;border-radius:4px;transition:all .2s ease;z-index:10}
.add-third-zone.drag-over{background:var(--drag-over)!important;border:2px dashed #27ae60!important;width:24px}
.team-box.color-blue{background:var(--blue-bg)!important;border-color:var(--header-bg)!important;color:var(--header-bg)!important}
.team-box.color-yellow{background:var(--yellow-bg)!important;border-color:var(--header-bg)!important;color:var(--header-bg)!important}
.team-box:hover{box-shadow:0 2px 6px rgba(0,0,0,.15)}
.team-box.dragging{opacity:.3}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-card{background:#fff;border-radius:12px;width:300px;padding:20px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);transform:scale(.95);transition:transform .2s}
.modal-overlay.active .modal-card{transform:scale(1)}
.modal-header{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:18px;color:#64748b;cursor:pointer;padding:0;line-height:1}
.modal-close:hover{color:#0f172a}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.modal-card input[type="text"]{width:100%;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;font-weight:600;text-transform:uppercase;outline:none;transition:border-color .2s}
.modal-card input#timeInput{text-transform:none}
.modal-card input[type="text"]:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.color-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-option-btn{height:40px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .15s}
.color-option-btn.yellow{background:var(--yellow-bg);border-color:#eab308}
.color-option-btn.blue{background:var(--blue-bg);border-color:#3b82f6}
.color-option-btn.selected{transform:scale(1.03);box-shadow:0 4px 6px -1px rgba(0,0,0,.15);outline:2px solid #2563eb}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions button{flex:1;padding:10px;border-radius:6px;border:none;font-weight:600;font-size:13px;cursor:pointer}
.btn-save-modal{background:#2563eb;color:#fff}.btn-save-modal:hover{background:#1d4ed8}
.btn-delete-modal{background:#f1f5f9;color:#ef4444}.btn-delete-modal:hover{background:#fee2e2}
</style>
</head>
<body>
<h1>⚽ Schemaläggning - Fotbollsplaner</h1>
<p class="info">
✨ <strong>Klicka på en ruta</strong> för att fylla i lag.<br>
🔄 <strong>Byta plats:</strong> Släpp ett lag direkt på en annan box för att byta/flytta plats.<br>
➕ <strong>Skapa 3-delning:</strong> Dra ett lag till den osynliga zonen längst till höger.
</p>
<div class="toolbar">
<button class="btn" id="btnSave" onclick="saveSchedule()">💾 Spara till molnet</button>
</div>
<div class="table-container">
<table>
<thead><tr>
<th class="day-header day-group-end" style="width:130px;">Plan / Tid</th>
<th class="day-header day-group-end">Måndag</th>
<th class="day-header day-group-end">Tisdag</th>
<th class="day-header day-group-end">Onsdag</th>
<th class="day-header day-group-end">Torsdag</th>
<th class="day-header day-group-end">Fredag</th>
</tr></thead>
<tbody id="schedule-body"></tbody>
</table>
</div>

<div class="modal-overlay" id="editModal">
<div class="modal-card">
<div class="modal-header"><span>Redigera pass</span><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-group">
<label class="form-label" for="teamInput">Lagnamn / Beteckning</label>
<input type="text" id="teamInput" placeholder="t.ex. P-19, F-15..." autocomplete="off">
</div>
<div class="form-group" id="timeGroup">
<label class="form-label" for="timeInput">Tid</label>
<input type="text" id="timeInput" placeholder="t.ex. 17:30-19:00" autocomplete="off">
</div>
<div class="form-group">
<label class="form-label">Välj färg</label>
<div class="color-options">
<button type="button" class="color-option-btn yellow selected" id="btnColorYellow" onclick="selectModalColor('yellow')" title="Gul"></button>
<button type="button" class="color-option-btn blue" id="btnColorBlue" onclick="selectModalColor('blue')" title="Blå"></button>
</div>
</div>
<div class="modal-actions">
<button type="button" class="btn-delete-modal" onclick="deleteModalContent()">Töm ruta</button>
<button type="button" class="btn-save-modal" onclick="saveModalContent()">Spara</button>
</div>
</div>
</div>

<script>
const BIN_ID = '6a91c98af5f4af5e294eca71';
const API_KEY = '$2a$10$UX4oAIFBKBUsF4SwhVXdMOV2B3n83/NNwFRw2mbvdxMk0a2XyHt46';

const pitches = ["Plan 1","Plan 2","Plan 3","Plan 4","Plan 5"];
const daysCount = 5;
const timePresets = {
    2: ["17:30-19:00", "19:00-20:30"],
    3: ["17:30-18:45", "18:45-20:00", "20:00-21:30"]
};
const emptyBox = () => ({ text: '', color: 'yellow', time: '' });

// Standardtid för en given plan + rad (baserat på antal pass på planen)
function defaultTime(boxId) {
    const [, pIdx, tIdx] = boxId.split('_').map(Number);
    const presets = timePresets[pitchSlotCounts[pIdx] || 2];
    return presets[tIdx] || '';
}

let pitchSlotCounts = { 0: 2, 1: 2, 2: 2, 3: 2, 4: 2 };
let scheduleData = {};

const tbody = document.getElementById('schedule-body');
let currentEditingBoxId = null;
let selectedColor = 'yellow';
let draggedSourceId = null;

function togglePitchSlots(pIdx) {
    pitchSlotCounts[pIdx] = pitchSlotCounts[pIdx] === 2 ? 3 : 2;
    buildTable();
}

function cleanup3SlotState() {
    pitches.forEach((_, pIdx) => {
        for (let tIdx = 0; tIdx < 3; tIdx++) {
            for (let d = 0; d < daysCount; d++) {
                if (scheduleData[`box_${pIdx}_${tIdx}_${d}_2`] !== undefined) {
                    const active = [];
                    for (let h = 0; h < 3; h++) {
                        const b = scheduleData[`box_${pIdx}_${tIdx}_${d}_${h}`];
                        if (b && b.text && b.text.trim() !== '') active.push(b);
                    }
                    if (active.length <= 2) {
                        for (let h = 0; h < 3; h++) delete scheduleData[`box_${pIdx}_${tIdx}_${d}_${h}`];
                        active.forEach((t, i) => { scheduleData[`box_${pIdx}_${tIdx}_${d}_${i}`] = t; });
                    }
                }
            }
        }
    });
}

function buildTable() {
    cleanup3SlotState();
    tbody.innerHTML = '';

    pitches.forEach((pitch, pIdx) => {
        const slotCount = pitchSlotCounts[pIdx] || 2;

        const pRow = document.createElement('tr');
        pRow.className = 'pitch-header';
        pRow.innerHTML = `
            <td colspan="${1 + daysCount}">
                <div class="pitch-header-content">
                    <span>${pitch}</span>
                    <button class="btn-pitch-slot" onclick="togglePitchSlots(${pIdx})">
                        ${slotCount === 2 ? '➕ Lägg till tidsslot (3 st)' : '➖ Minska tidsslots (2 st)'}
                    </button>
                </div>
            </td>`;
        tbody.appendChild(pRow);

        for (let tIdx = 0; tIdx < slotCount; tIdx++) {
            const tr = document.createElement('tr');

            const tdTime = document.createElement('td');
            tdTime.className = 'time-col day-group-end';
            tr.appendChild(tdTime);

            for (let d = 0; d < daysCount; d++) {
                const td = document.createElement('td');
                td.className = 'slot day-group-end';

                const wrapper = document.createElement('div');
                wrapper.className = 'team-slot-wrapper';

                const subBoxCount = scheduleData[`box_${pIdx}_${tIdx}_${d}_2`] !== undefined ? 3 : 2;

                for (let h = 0; h < subBoxCount; h++) {
                    const boxId = `box_${pIdx}_${tIdx}_${d}_${h}`;
                    wrapper.appendChild(createTeamBox(boxId, scheduleData[boxId] || emptyBox()));
                }

                if (subBoxCount === 2) {
                    const addZone = document.createElement('div');
                    addZone.className = 'add-third-zone';
                    addZone.addEventListener('dragover', e => { e.preventDefault(); addZone.classList.add('drag-over'); });
                    addZone.addEventListener('dragleave', () => addZone.classList.remove('drag-over'));
                    addZone.addEventListener('drop', e => {
                        e.preventDefault();
                        addZone.classList.remove('drag-over');
                        if (!draggedSourceId) return;
                        const src = scheduleData[draggedSourceId];
                        if (!src || !src.text) return;
                        scheduleData[`box_${pIdx}_${tIdx}_${d}_2`] = { ...src };
                        scheduleData[draggedSourceId] = emptyBox();
                        buildTable();
                    });
                    wrapper.appendChild(addZone);
                }

                td.appendChild(wrapper);
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
    });
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function createTeamBox(id, data) {
    const text = data.text || '';
    const color = data.color || 'yellow';
    const time = data.time || defaultTime(id);

    const box = document.createElement('div');
    box.className = 'team-box';
    box.id = id;

    const hasText = text.trim() !== '';
    box.draggable = hasText;
    box.innerHTML = `<span>${escapeHtml(text)}</span>` +
        (hasText && time ? `<span class="team-time">${escapeHtml(time)}</span>` : '');

    if (hasText) {
        box.classList.add('has-content', color === 'blue' ? 'color-blue' : 'color-yellow');
        box.addEventListener('dragstart', handleDragStart);
        box.addEventListener('dragend', handleDragEnd);
    }

    box.addEventListener('click', () => openModal(box));
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag-over'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
    box.addEventListener('drop', handleBoxDrop);
    return box;
}

/* --- MODAL --- */
function openModal(box) {
    currentEditingBoxId = box.id;
    const data = scheduleData[box.id] || emptyBox();
    document.getElementById('teamInput').value = data.text || '';
    const isEmpty = !(data.text && data.text.trim());
    document.getElementById('timeGroup').style.display = isEmpty ? 'none' : '';
    document.getElementById('timeInput').value = isEmpty ? '' : (data.time || defaultTime(box.id));
    selectModalColor(data.text ? (data.color || 'yellow') : 'yellow');
    document.getElementById('editModal').classList.add('active');
    setTimeout(() => {
        const input = document.getElementById('teamInput');
        input.focus();
        input.select();
    }, 50);
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
    currentEditingBoxId = null;
}

function selectModalColor(color) {
    selectedColor = color;
    document.getElementById('btnColorYellow').classList.toggle('selected', color === 'yellow');
    document.getElementById('btnColorBlue').classList.toggle('selected', color === 'blue');
}

function saveModalContent() {
    if (!currentEditingBoxId) return;
    const text = document.getElementById('teamInput').value.trim().toUpperCase();
    const existing = scheduleData[currentEditingBoxId];
    const wasEmpty = !(existing && existing.text && existing.text.trim());
    let time = wasEmpty ? '' : document.getElementById('timeInput').value.trim();
    if (time === defaultTime(currentEditingBoxId)) time = '';
    scheduleData[currentEditingBoxId] = text
        ? { text, color: selectedColor, time }
        : emptyBox();
    closeModal();
    buildTable();
}

function deleteModalContent() {
    if (!currentEditingBoxId) return;
    scheduleData[currentEditingBoxId] = emptyBox();
    closeModal();
    buildTable();
}

document.getElementById('editModal').addEventListener('click', e => {
    if (e.target.id === 'editModal') closeModal();
});

['teamInput', 'timeInput'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') saveModalContent();
        else if (e.key === 'Escape') closeModal();
    });
});

/* --- DRAG & DROP --- */
function handleDragStart(e) {
    draggedSourceId = this.id;
    this.classList.add('dragging');
    e.dataTransfer.setData('text/plain', this.id);
    e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd() {
    this.classList.remove('dragging');
    draggedSourceId = null;
}

function handleBoxDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    if (!draggedSourceId) return;
    const targetId = this.id;
    if (targetId === draggedSourceId) return;

    const src = scheduleData[draggedSourceId] || emptyBox();
    const tgt = scheduleData[targetId] || emptyBox();
    scheduleData[targetId] = { ...src };
    scheduleData[draggedSourceId] = { ...tgt };
    buildTable();
}

/* --- JSONBin.io MOLNLAGRING --- */
async function saveSchedule() {
    const btn = document.getElementById('btnSave');
    btn.textContent = '⏳ Sparar...';
    btn.disabled = true;
    const data = { scheduleData, pitchSlotCounts };
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify(data)
        });
        alert(response.ok ? '💾 Schemat har sparats i molnet!' : '⚠️ Kunde inte spara. Kontrollera dina API-uppgifter.');
    } catch (error) {
        console.error('Fel vid sparning:', error);
        alert('⚠️ Kommunikationsfel vid sparning.');
    } finally {
        btn.textContent = '💾 Spara till molnet';
        btn.disabled = false;
    }
}

async function loadSchedule() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
        });
        if (response.ok) {
            const result = await response.json();
            const data = result.record || {};
            if (data.scheduleData) scheduleData = data.scheduleData;
            if (data.pitchSlotCounts) pitchSlotCounts = data.pitchSlotCounts;
        }
    } catch (error) {
        console.warn('Nätverksfel eller lokal öppning, ritar tomt/lokalt schema:', error);
    } finally {
        buildTable();
    }
}

document.addEventListener('DOMContentLoaded', loadSchedule);
</script>
</body>
</html>
